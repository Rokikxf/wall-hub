# wall-hub is a Django project, not an installable package: this file only holds
# metadata and tool settings. Dependencies are pinned in requirements*.txt.

[project]
name = "wall-hub"
version = "0.1.0"
description = "Web hub of the wall IT asset management system."
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wallhub.test_settings"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ"]

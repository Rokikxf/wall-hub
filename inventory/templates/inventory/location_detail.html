{% extends "base.html" %}
{% block title %}{{ location }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="crumbs"><a href="{% url 'location-list' %}">Locations</a> / {{ location }}</div>
    <h1>{{ location }}</h1>
    {% if location.notes %}<p class="page-subtitle">{{ location.notes|linebreaksbr }}</p>{% endif %}
  </div>
  <div class="page-actions">
    <a class="btn btn-outline-primary" href="{% url 'location-edit' location.pk %}">Edit</a>
    <a class="btn btn-outline-danger" href="{% url 'location-delete' location.pk %}">Delete</a>
  </div>
</div>
<div class="card">
  <div class="card-header"><h2>Devices</h2></div>
  {% include "inventory/_device_table.html" %}
</div>
{% endblock %}

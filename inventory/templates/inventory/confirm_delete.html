{% extends "base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Delete {{ object }}?</h1>
<p>{{ note }} This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Delete</button>
  <a class="btn btn-link" href="{{ object.get_absolute_url }}">Cancel</a>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Delete {{ object }}{% endblock %}
{% block content %}
<div class="card form-card border-danger-subtle">
  <div class="card-body">
    <h1 class="h4">Delete {{ object }}?</h1>
    <p>{{ note }} This cannot be undone.</p>
    <form method="post" class="d-flex gap-2 m-0">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a class="btn btn-outline-secondary" href="{{ object.get_absolute_url }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

{% if scan.status == "ok" %}<span class="status status-up">OK</span>
{% elif scan.status == "partial" %}<span class="status status-warn">Partial</span>
{% elif scan.status == "error" or scan.status == "failed" %}<span class="status status-down" title="{{ scan.message }}">{{ scan.get_status_display }}</span>
{% elif scan.status == "running" %}<span class="status status-busy">Running</span>
{% else %}<span class="status status-muted">{{ scan.get_status_display }}</span>{% endif %}

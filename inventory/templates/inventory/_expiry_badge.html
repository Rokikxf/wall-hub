{% if status == "none" %}<span class="muted">{{ none_text }}</span>
{% elif status == "expired" %}<span class="status status-down">Ended {{ date|date:"j M Y" }}</span>
{% elif status == "soon" %}<span class="status status-warn">{{ date|date:"j M Y" }} · {% if days == 0 %}today{% else %}in {{ days }} day{{ days|pluralize }}{% endif %}</span>
{% else %}{{ date|date:"j M Y" }}{% endif %}

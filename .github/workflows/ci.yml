name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wallhub
          POSTGRES_USER: wallhub
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallhub -d wallhub"
          --health-interval 5s
          --health-retries 12
    env:
      POSTGRES_DB: wallhub
      POSTGRES_USER: wallhub
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      DJANGO_SETTINGS_MODULE: wallhub.test_settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Test (PostgreSQL)
        run: pytest

  # The whole stack as it runs on the VM: build the image, start web, worker,
  # beat, db and redis. Then scan 127.0.0.1 for real (worker, wall-scan, nmap),
  # monitor the device it finds, and run a real health check of it
  # (worker, wall-healthcheck, ping).
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-$(openssl rand -hex 24)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          # The worker shares the host's network, so the host decides whether
          # unprivileged ping sockets are allowed (Ubuntu allows them by default).
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Web answers
        run: curl --fail --silent http://localhost:8000/accounts/login/ | grep -q "Log in"

      - name: End-to-end scan of 127.0.0.1
        run: docker compose exec -T web python manage.py scan 127.0.0.1 --wait --wait-timeout 300

      - name: End-to-end health check of 127.0.0.1
        run: |
          docker compose exec -T web python manage.py shell -c "
          from inventory.models import Device
          found = Device.objects.filter(ip='127.0.0.1').update(monitored=True)
          assert found == 1, f'the scan did not find 127.0.0.1 ({found})'
          "
          docker compose exec -T web python manage.py healthcheck --wait --wait-timeout 120 | tee healthcheck.out
          grep -q "1 up, 0 down" healthcheck.out

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes

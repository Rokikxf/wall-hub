name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wallhub
          POSTGRES_USER: wallhub
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallhub -d wallhub"
          --health-interval 5s
          --health-retries 12
    env:
      POSTGRES_DB: wallhub
      POSTGRES_USER: wallhub
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      DJANGO_SETTINGS_MODULE: wallhub.test_settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Test (PostgreSQL)
        run: pytest

  # The whole stack as it runs on the VM: build the image, start web, worker,
  # db and redis, then queue a real scan of 127.0.0.1 and wait for the worker
  # to finish it with nmap.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-$(openssl rand -hex 24)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Web answers
        run: curl --fail --silent http://localhost:8000/accounts/login/ | grep -q "Log in"

      - name: End-to-end scan of 127.0.0.1
        run: docker compose exec -T web python manage.py scan 127.0.0.1 --wait --wait-timeout 300

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes

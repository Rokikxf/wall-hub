{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Log in</h1>
      <p class="muted small mb-4">IT asset management and network monitoring.</p>
      {% if form.errors %}<div class="alert alert-danger py-2">Wrong username or password.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Password</label>
          <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
